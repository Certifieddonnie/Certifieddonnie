name: Rotate 3D Profile View
on:
  schedule:
    # Cron is in UTC. Lagos is UTC+1.
    - cron: '0 6 * * *'   # 7:00 AM WAT
    - cron: '0 11 * * *'  # 12:00 PM WAT
    - cron: '0 17 * * *'  # 6:00 PM WAT
    - cron: '0 23 * * *'  # 12:00 AM WAT
  workflow_dispatch:      # Allows you to trigger it manually for testing

jobs:
  rotate-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Python Script
        env:
          TZ: 'Africa/Lagos' # Forces the datetime module to use your local timezone
        run: python rotate_profile.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "Update 3D profile view based on time of day" || exit 0
          git push
